name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: '1.1.7'
  WAILS_VERSION: 'v2.10.2'
  GO_VERSION: '1.23.x'

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build Linux application
        run: wails build -platform linux/amd64
      - name: Test Go backend (race + vet)
        run: |
          go test -race ./...
          go vet ./...
      - name: Package DEB
        run: nfpm package --config nfpm.yaml --packager deb --target "build/bin/CodexaScanner_${APP_VERSION}_amd64.deb"
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: codexa-scanner-linux-amd64-deb
          path: build/bin/CodexaScanner_${{ env.APP_VERSION }}_amd64.deb
          if-no-files-found: error

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build Windows executable
        run: wails build -platform windows/amd64
      - name: Test Go backend
        shell: bash
        run: |
          go test ./...
          go vet ./...
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: codexa-scanner-windows-amd64-exe
          path: build/bin/CodexaScanner.exe
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15
            wails_platform: darwin/amd64
          - arch: arm64
            runner: macos-15
            wails_platform: darwin/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build macOS application
        run: wails build -platform ${{ matrix.wails_platform }}
      - name: Test Go backend
        run: |
          go test ./...
          go vet ./...
      - name: Create DMG
        run: |
          set -euo pipefail
          app_path="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          echo "Packaging app bundle: $app_path"
          rm -rf dmg-staging
          mkdir -p dmg-staging
          ditto "$app_path" dmg-staging/CodexaScanner.app
          hdiutil create \
            -volname CodexaScanner \
            -srcfolder dmg-staging \
            -ov \
            -format UDZO \
            "build/bin/CodexaScanner-${{ matrix.arch }}.dmg"
          test -s "build/bin/CodexaScanner-${{ matrix.arch }}.dmg"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: codexa-scanner-macos-${{ matrix.arch }}-dmg
          path: build/bin/CodexaScanner-${{ matrix.arch }}.dmg
          if-no-files-found: error

  checksums:
    name: Generate SHA256 Checksums
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: [linux-deb, windows-exe, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-assets -type f \( -name '*.deb' -o -name '*.exe' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -la dist
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: codexa-scanner-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: [linux-deb, windows-exe, macos-dmg, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-assets -type f \( -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name 'SHA256SUMS.txt' \) -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Codexa Scanner ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
