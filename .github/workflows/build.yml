name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build Linux application
        run: wails build -platform linux/amd64
      - name: Test Go backend (race + vet)
        run: |
          go test -race ./...
          go vet ./...
      - name: Package DEB
        run: nfpm package --config nfpm.yaml --packager deb --target build/bin/CodexaScanner_1.1.0_amd64.deb
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: codexa-scanner-linux-amd64-deb
          path: build/bin/CodexaScanner_1.1.0_amd64.deb
          if-no-files-found: error

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build Windows executable
        run: wails build -platform windows/amd64
      - name: Test Go backend
        shell: bash
        run: |
          go test ./...
          go vet ./...
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: codexa-scanner-windows-amd64-exe
          path: build/bin/CodexaScanner.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: [linux-deb, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-assets -type f \( -name '*.deb' -o -name '*.exe' \) -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Codexa Scanner ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
